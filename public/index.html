<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="theme-color" content="#0a0b10" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Fitnest" />
  <title>Fitnest</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./assets/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./build2.css" />
  <link rel="stylesheet" href="./build21.css" />
  <link rel="stylesheet" href="./build22.css" />
  <link rel="stylesheet" href="./build23.css" />
  <link rel="stylesheet" href="./build24.css" />
  <link rel="stylesheet" href="./build241.css" />
  <link rel="stylesheet" href="./build243.css" />
  <link rel="stylesheet" href="./build244.css" />
  <link rel="stylesheet" href="./build25.css" />
  <link rel="stylesheet" href="./build251.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div><p class="eyebrow" id="dateLabel">Heute</p><h1 id="pageTitle">Dein Tag</h1></div>
      <button class="avatar-button" id="profileButton" aria-label="Profil öffnen">CE</button>
    </header>
    <main id="app"></main>
    <nav class="tabbar" aria-label="Hauptnavigation">
      <button class="tab active" data-view="today"><span>◉</span><small>Heute</small></button>
      <button class="tab" data-view="plan"><span>▦</span><small>Plan</small></button>
      <button class="tab" data-view="nutrition"><span>⌁</span><small>Essen</small></button>
      <button class="tab" data-view="coach"><span>✦</span><small>Coach</small></button>
      <button class="tab" data-view="wiki"><span>⌕</span><small>Übungen</small></button>
      <button class="tab" data-view="progress"><span>↗</span><small>Fortschritt</small></button>
    </nav>
  </div>
  <dialog id="sheet" class="sheet"><div id="sheetContent"></div></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
