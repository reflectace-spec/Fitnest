name: Deploy Fitnest to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'wrangler.jsonc'
      - '.github/workflows/deploy-cloudflare.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fitnest-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate Cloudflare secrets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo 'Missing CLOUDFLARE_API_TOKEN' && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo 'Missing CLOUDFLARE_ACCOUNT_ID' && exit 1)

      - name: Deploy production Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy

      - name: Verify production assets
        shell: bash
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5 6; do
            curl -fsSL "https://fitnest.reflectace.workers.dev/app.js?sha=${GITHUB_SHA}&try=${i}" -o /tmp/app.js && \
            curl -fsSL "https://fitnest.reflectace.workers.dev/sw.js?sha=${GITHUB_SHA}&try=${i}" -o /tmp/sw.js && \
            cmp -s public/app.js /tmp/app.js && cmp -s public/sw.js /tmp/sw.js && exit 0
            sleep 5
          done
          echo 'Production verification failed: live assets do not match this commit.'
          exit 1
