name: Bootstrap Fitnest Build 2

on:
  push:
    branches:
      - agent/build-2-workout-logging

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/build-2-workout-logging
      - name: Reassemble Build 2
        run: |
          cat .bootstrap-build2/chunk-* > /tmp/build2.b64
          base64 -d /tmp/build2.b64 > /tmp/build2.zip
          unzip -o /tmp/build2.zip -d .
          rm -rf .bootstrap-build2
      - name: Validate Build 2
        run: |
          node --check public/app.js
          node --check public/app-v2.js
          node --check public/sw.js
          test -f public/assets/exercise-sprite.webp
      - name: Commit Build 2
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public supabase .bootstrap-build2
          git commit -m "Build 2.0 workout logging and generated exercise art" || exit 0
          git push origin HEAD:agent/build-2-workout-logging
