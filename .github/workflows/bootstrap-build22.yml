name: Bootstrap Fitnest Build 2.2

on:
  push:
    branches:
      - agent/build-2-2-adaptive-progress

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/build-2-2-adaptive-progress
      - name: Reassemble Build 2.2 addon
        run: |
          cat .bootstrap-build22/chunk-* > /tmp/app-v22.b64
          base64 -d /tmp/app-v22.b64 > public/app-v22-addon.js
          rm -rf .bootstrap-build22
      - name: Validate Build 2.2
        run: |
          node --check public/app-v22-addon.js
          test -f public/build22.css
          test -f supabase/migrations/0005_adaptive_progress.sql
      - name: Commit Build 2.2 addon
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public/app-v22-addon.js .bootstrap-build22
          git commit -m "Build 2.2 adaptive progress module" || exit 0
          git push origin HEAD:agent/build-2-2-adaptive-progress
