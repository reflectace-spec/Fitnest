name: Fitnest Build 3.8.3 changelog checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build383:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check changelog module syntax
        run: |
          node --input-type=module --check < public/app-v383-changelog.js
          node tests/build383.test.mjs

      - name: Verify settings and app shell wiring
        run: |
          grep -q "data-v383-changelog" public/app-v383-changelog.js
          grep -q "app-v383-changelog.js" public/app.js
          grep -q "build383.css" public/index.html
          grep -q "app-v383-changelog.js" public/sw.js
          grep -q "build383.css" public/sw.js
          grep -Eq "fitnest-shell-v3-8-[3-9][0-9]*" public/sw.js

      - name: Guard public files against secrets
        run: |
          ! grep -R -E "service_role|SUPABASE_SERVICE_ROLE_KEY|OPENAI_API_KEY|sk-[A-Za-z0-9_-]{20,}" public
