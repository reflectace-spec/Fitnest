name: Fitnest CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate JavaScript
        run: |
          node --check public/app.js
          node --check public/app-v2.js
          node --check public/app-v21-addon.js
          node --check public/sw.js
      - name: Validate assets
        run: |
          test -f public/assets/exercise-sprite.webp
          test -f public/build21.css
      - name: Validate manifest
        run: python3 -m json.tool public/manifest.webmanifest >/dev/null
      - name: Guard public config
        run: |
          ! grep -Eqi '(service_role|sb_secret_|SUPABASE_SECRET)' public/config.js
