name: Fitnest CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate JavaScript
        run: |
          node --check public/app.js
          node --check public/app-v2.js
          node --check public/app-v24-guard.js
          node --check public/app-v21-addon.js
          node --check public/app-v21-navfix.js
          node --check public/app-v22-addon.js
          node --check public/app-v23-addon.js
          node --check public/app-v24-addon.js
          node --check public/app-v241-addon.js
          node --check public/app-v242-addon.js
          node --check public/app-v243-addon.js
          node --check public/app-v244-addon.js
          node --check public/app-v244-safeapply.js
          node --check public/sw.js
      - name: Validate assets
        run: |
          test -f public/assets/exercise-sprite.webp
          test -f public/build21.css
          test -f public/build22.css
          test -f public/build23.css
          test -f public/build24.css
          test -f public/build241.css
          test -f public/build243.css
          test -f public/build244.css
          test -f supabase/migrations/0006_push_reminders.sql
          test -f supabase/migrations/0007_push_reminder_deny_policies.sql
          test -f supabase/migrations/0008_coach_nutrition_profiles.sql
          test -f supabase/migrations/0009_coach_nutrition_profile_index.sql
          test -f supabase/migrations/0010_celiac_nutrition_profiles.sql
          test -f supabase/functions/push-dispatch/index.ts
          test -f supabase/functions/coach-analysis/index.ts
          test -f supabase/functions/recipe-generator/index.ts
      - name: Validate manifest
        run: python3 -m json.tool public/manifest.webmanifest >/dev/null
      - name: Guard public config
        run: |
          ! grep -Eqi '(service_role|sb_secret_|SUPABASE_SECRET|VAPID_PRIVATE|OPENAI_API_KEY)' public/config.js
          ! grep -Eqi '(sk-[A-Za-z0-9_-]{20,}|sb_secret_)' public/app-v24-addon.js public/app-v241-addon.js public/app-v242-addon.js public/app-v243-addon.js public/app-v244-addon.js public/app-v244-safeapply.js
          ! grep -Eqi 'sk-[A-Za-z0-9_-]{20,}' supabase/functions/recipe-generator/index.ts
