name: Fitnest Build 3.4 progress dashboard checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build34:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check browser module syntax
        run: node --input-type=module --check < public/app-v34-progress.js

      - name: Verify app shell integration
        run: |
          grep -q "app-v34-progress.js" public/app.js
          grep -q "build34.css" public/index.html
          grep -q "app-v34-progress.js" public/sw.js
          grep -q "build34.css" public/sw.js
          grep -q "fitnest-shell-v3-4-0" public/sw.js

      - name: Verify progress dashboard features
        run: |
          grep -q "data-v34-range" public/app-v34-progress.js
          grep -q "Gewichtsverlauf" public/app-v34-progress.js
          grep -q "Übungsentwicklung" public/app-v34-progress.js
          grep -q "Rückmeldungen" public/app-v34-progress.js
          grep -q "CSV exportieren" public/app-v34-progress.js
          grep -q "new MutationObserver" public/app-v34-progress.js

      - name: Verify persistence and protected cloud sync
        run: |
          grep -q "body_metrics" public/app-v34-progress.js
          grep -q "workout_sessions" public/app-v34-progress.js
          grep -q "daily_adherence" public/app-v34-progress.js
          grep -q "onConflict:'user_id,measured_on'" public/app-v34-progress.js
          grep -q "body_metrics_owner_all" supabase/migrations/0001_initial.sql
          grep -q "workout_sessions_owner_all" supabase/migrations/0001_initial.sql
          grep -q "Users can view own daily adherence" supabase/migrations/0017_daily_adherence.sql

      - name: Guard public files against secrets
        run: |
          ! grep -R -E "service_role|SUPABASE_SERVICE_ROLE_KEY|OPENAI_API_KEY|sk-[A-Za-z0-9_-]{20,}" public
