name: Bootstrap Fitnest source

on:
  push:
    branches:
      - agent/build-1-foundation

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack source bundle
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f .bootstrap/fitnest-source.zip ]; then
            echo "Bootstrap bundle already removed."
            exit 0
          fi
          unzip -oq .bootstrap/fitnest-source.zip -d .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Unpack Fitnest Build 1 source"
          git push
