name: Bootstrap Fitnest source

on:
  push:
    branches:
      - agent/build-1-foundation

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble and unpack source bundle
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f .bootstrap/chunk-06 ]; then
            echo "Waiting for all bootstrap chunks."
            exit 0
          fi
          cat .bootstrap/chunk-* | base64 -d > /tmp/fitnest-source.zip
          unzip -t /tmp/fitnest-source.zip >/dev/null
          unzip -oq /tmp/fitnest-source.zip -d .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Unpack Fitnest Build 1 source"
          git push
